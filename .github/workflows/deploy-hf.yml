name: Deploy Hugging Face Space

# Manual only. Docker Spaces on free cpu-basic return HTTP 402 unless the
# Hugging Face account has a PRO subscription, so this does not run on push.
on:
  workflow_dispatch:

# One deploy at a time. A later push waits instead of racing the upload.
concurrency:
  group: deploy-huggingface-pandaisop-aqi-predictor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  verify-upload:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Serve the upload set and build its Docker image
        run: python -m deploy.huggingface.verify_upload --docker

  deploy:
    needs: verify-upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install -r deploy/huggingface/requirements.txt

      - name: Upload the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python -m deploy.huggingface.push_space

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll Space health
        run: python -m deploy.huggingface.smoke_space
